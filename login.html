<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Erwin Anthony Rodrigues</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F7F2EB">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'">
  <link rel="stylesheet" href="assets/portfolio.css">
  <link rel="stylesheet" href="assets/site.css">
</head>
<body class="min-h-screen bg-[#F7F2EB] font-[Segoe_UI,system-ui,sans-serif] text-[#241F1C] antialiased">
  <header class="border-b border-[#D9CBBA] bg-[#EFE4D6]">
    <nav aria-label="Account" class="font-bahnschrift mx-auto flex w-full max-w-6xl items-center justify-between px-4 py-3 sm:px-6">
      <a href="index.html" class="inline-flex min-h-11 items-center">Back to portfolio</a>
      <span class="text-sm text-[#5C5148]">Admin login</span>
    </nav>
  </header>

  <main class="mx-auto flex w-full max-w-md flex-col px-4 py-16 sm:px-6">
    <h1 class="text-center text-[clamp(1.6rem,2.4vw,2.1rem)] font-bold tracking-tight">Login</h1>
    <p class="mt-3 text-center text-sm leading-relaxed text-[#5C5148]">
      Only the owner account can open the data upload page.
      After signing in you can upload your personal photo at
      <span class="whitespace-nowrap">admin.html#personal-photo</span>.
    </p>

    <form id="login-form" class="mt-10 space-y-5" novalidate>
      <div>
        <label for="email" class="block text-sm font-medium">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required
          class="mt-2 w-full min-h-11 border border-[#D9CBBA] bg-[#F7F2EB] px-3 text-base text-[#241F1C]">
      </div>
      <div>
        <label for="password" class="block text-sm font-medium">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required
          class="mt-2 w-full min-h-11 border border-[#D9CBBA] bg-[#F7F2EB] px-3 text-base text-[#241F1C]">
      </div>
      <p id="login-error" class="text-sm text-[#8B2E2E]" role="alert" hidden></p>
      <button type="submit"
        class="inline-flex min-h-11 w-full items-center justify-center bg-[#6E4630] px-4 text-base font-medium text-[#F7F2EB] hover:bg-[#241F1C]">
        Sign in
      </button>
    </form>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/login-page.js"></script>
</body>
</html>
